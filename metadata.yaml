# Abstract
abstract: "We study LiteFNO (Ahn et al., 2025), a lightweight Fourier Neural Operator for time-dependent PDEs, through a from-scratch reproducibility study and a novel ablation study. We reimplement the architecture (no public code was available) and introduce a parameter-matched low-rank CNN baseline absent from the original paper. Across three random seeds on the Gray-Scott dataset at 32×32 resolution, the CNN matches or outperforms LiteFNO on one-step VRMSE and autoregressive rollout, providing no consistent evidence for a Fourier inductive bias advantage at this scale. We confirm the 'compact beats dense' claim while documenting implementation ambiguities."

